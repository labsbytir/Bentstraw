<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Bentstraw</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap"><style>:root{color-scheme:dark;--fg:#e8e8e8;--mut:#9a9a9a}body{font-family:Fira Code,ui-monospace,monospace;background:#000;color:var(--fg);max-width:900px;margin:0 auto;padding:1.5rem 1rem}a{color:#fff}nav.top{display:flex;gap:1rem;flex-wrap:wrap;border-bottom:1px solid #8884;padding-bottom:.8rem;margin-bottom:1.5rem}nav.top a{text-decoration:none;color:inherit}nav.top a.brand{font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin:1rem 0}.card{border:1px solid #8884;border-radius:8px;padding:1rem}.card p{font-size:.9rem;opacity:.85}.btn{display:inline-block;margin:.3rem .3rem 0 0;padding:.4rem .9rem;border:1px solid #fff;border-radius:6px;text-decoration:none;color:inherit;background:none;font-size:.9rem;cursor:pointer}.btn.primary{background:#fff;color:#000;font-weight:700}input,select{width:100%;padding:.5rem .7rem;border:1px solid #8886;border-radius:8px;font:inherit;background:#000;color:var(--fg);margin:.5rem 0}.meta{font-size:.85rem;opacity:.75}footer{margin-top:3rem;font-size:.8rem;opacity:.7;border-top:1px solid #8884;padding-top:1rem}
</style></head><body> <nav class="top"><a class="brand" href="/">Bentstraw</a><a href="/quiz/">Quiz</a><a href="/search/">Search</a></nav> <h1>Match quiz</h1> <p class="meta">3 questions → matched tools + skills.</p> <label>1. Past or future?<select id="a1"><option value="past">forgotten past</option><option value="future">tomorrow's tech</option></select></label> <label>2. What for?<select id="a2"><option value="agents">agent skills</option><option value="ml">models / ml</option><option value="os">tools / os</option></select></label> <label>3. Vibe?<select id="a3"><option value="minimal">minimal</option><option value="browser">browser</option><option value="embeddings">embeddings</option></select></label> <p><button class="btn primary" id="go">Match me</button></p> <div id="out" class="grid"></div> <footer><a href="/">← back</a></footer> <script type="module">
import { create, load, search } from 'https://cdn.jsdelivr.net/npm/@orama/orama@latest/+esm';
const db=create({schema:{id:'string',kind:'string',name:'string',blurb:'string',tags:'string[]'}});
await load(db,await fetch('/orama.json').then(r=>r.json()));
document.getElementById('go').onclick=async()=>{
  const a1=document.getElementById('a1').value, a2=document.getElementById('a2').value, a3=document.getElementById('a3').value;
  const term=[a1,a2,a3].join(' ');
  const r=await search(db,{term,limit:4});
  document.getElementById('out').innerHTML=r.hits.map(h=>`<div class="card"><h3>${h.document.name}</h3><p>${h.document.blurb}</p><p class="meta">${h.document.id}</p></div>`).join('')||'<p>No match — try again.</p>';
};
</script> </body></html>
